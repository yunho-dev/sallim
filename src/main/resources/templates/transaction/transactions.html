<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <title>거래 내역</title>

    <th:block layout:fragment="page-css">
        <link th:href="@{/css/transaction/transactions.css}" rel="stylesheet"/>
    </th:block>

    <th:block layout:fragment="page-js">
        <script th:src="@{/js/transaction/transactions.js}"></script>
    </th:block>
</head>

<body>
<section layout:fragment="content">

    <!-- 페이지 헤더 -->
    <div class="page-header d-print-none">
        <div class="container-fluid">
            <div class="row g-2 align-items-center">
                <div class="col">
                    <div class="page-pretitle" style="margin-bottom: 5px;">거래 내역</div>
                    <h2 class="page-title">거래 내역</h2>
                </div>
                <div class="col-auto ms-auto d-print-none">
                    <button type="button" class="btn btn-add" id="btnOpenModal" data-bs-toggle="modal" data-bs-target="#modal-add-transaction">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                        거래 추가
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="page-body">
        <div class="container-fluid">

            <!-- 필터 바 -->
            <div class="card mb-4">
                <div class="filter-bar">

                    <!-- 월 선택 -->
                    <div class="month-selector">
                        <button type="button" class="btn-icon" id="btnPrevMonth" title="이전 달">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                 fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M15 18l-6-6 6-6"/>
                            </svg>
                        </button>
                        <span class="month-label" id="monthLabel"></span>
                        <button type="button" class="btn-icon" id="btnNextMonth" title="다음 달">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                 fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 18l6-6-6-6"/>
                            </svg>
                        </button>
                    </div>

                    <div class="filter-divider"></div>

                    <!-- 카테고리 드롭다운 -->
                    <div class="dropdown">
                        <button class="btn btn-outline-secondary filter-dropdown-btn dropdown-toggle" type="button"
                                id="categoryFilterBtn" data-bs-toggle="dropdown" aria-expanded="false">
                            전체 카테고리
                        </button>
                        <ul class="dropdown-menu" id="categoryFilterMenu"></ul>
                    </div>

                    <!-- 결제수단 드롭다운 -->
                    <div class="dropdown">
                        <button class="btn btn-outline-secondary filter-dropdown-btn dropdown-toggle" type="button"
                                id="paymentFilterBtn" data-bs-toggle="dropdown" aria-expanded="false">
                            전체 결제수단
                        </button>
                        <ul class="dropdown-menu" id="paymentFilterMenu"></ul>
                    </div>

                    <!-- 유형 토글 -->
                    <div class="btn-group type-toggle" role="group">
                        <input type="radio" class="btn-check" name="type-filter" id="type-all" checked>
                        <label class="btn" for="type-all">전체</label>

                        <input type="radio" class="btn-check" name="type-filter" id="type-income">
                        <label class="btn btn-type-income" for="type-income">수입</label>

                        <input type="radio" class="btn-check" name="type-filter" id="type-expense">
                        <label class="btn btn-type-expense" for="type-expense">지출</label>
                    </div>

                    <div class="filter-divider"></div>

                    <!-- 휴지통 뷰 토글 -->
                    <button type="button" class="btn btn-outline-secondary filter-dropdown-btn" id="btnToggleTrash" title="삭제된 거래내역 보기">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16Z"/>
                        </svg>
                        삭제된 항목
                    </button>

                </div>
            </div>

            <!-- 요약 카드 -->
            <div class="row row-deck row-cards mb-4">

                <div class="col-sm-6 col-lg-4">
                    <div class="card">
                        <div class="card-body d-flex align-items-center gap-3">
                            <span class="summary-icon summary-icon-income">
                                <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24"
                                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 19V5M5 12l7-7 7 7"/>
                                </svg>
                            </span>
                            <div>
                                <div class="summary-label">이번 달 수입</div>
                                <div class="summary-value text-income" id="summary-income">₩0</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-sm-6 col-lg-4">
                    <div class="card">
                        <div class="card-body d-flex align-items-center gap-3">
                            <span class="summary-icon summary-icon-expense">
                                <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24"
                                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 5v14M5 12l7 7 7-7"/>
                                </svg>
                            </span>
                            <div>
                                <div class="summary-label">이번 달 지출</div>
                                <div class="summary-value text-expense" id="summary-expense">₩0</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-sm-6 col-lg-4">
                    <div class="card">
                        <div class="card-body d-flex align-items-center gap-3">
                            <span class="summary-icon summary-icon-net">
                                <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24"
                                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M3 3v18h18"/>
                                    <path d="M7 14l4-4 3 3 5-6"/>
                                </svg>
                            </span>
                            <div>
                                <div class="summary-label">이번 달 순수익</div>
                                <div class="summary-value" id="summary-net">₩0</div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- 거래 테이블 -->
            <div class="card">

                <div class="txn-table-head">
                    <span>날짜</span>
                    <span>카테고리</span>
                    <span>내용</span>
                    <span>결제수단</span>
                    <span class="text-end">금액</span>
                    <span></span>
                </div>

                <div id="txn-body"></div>

                <div class="text-center text-muted py-5 d-none" id="txn-empty">
                    해당 조건의 거래내역이 없습니다.
                </div>

                <!-- 테이블 푸터 / 페이지네이션 -->
                <div class="txn-table-foot d-flex align-items-center justify-content-between">
                    <span class="text-muted-sm" id="txn-count-label">전체 0건</span>
                    <ul class="pagination pagination-sm mb-0" id="txn-pagination"></ul>
                </div>

            </div>

        </div>
    </div>

    <!-- 거래 추가 모달 -->
    <div class="modal modal-blur fade" id="modal-add-transaction" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">거래 추가</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">

                    <!-- 영수증 OCR 자동 채우기 -->
                    <div class="ocr-fill-row mb-3">
                        <button type="button" class="btn btn-ocr-fill w-100" id="btnOcrFill">
                            <span class="spinner-border spinner-border-sm d-none" id="ocrSpinner" role="status" aria-hidden="true"></span>
                            <span id="ocrFillLabel">📷 영수증으로 내용 채우기</span>
                        </button>
                        <input type="file" accept="image/*" class="d-none" id="ocrFileInput">
                        <div class="ocr-fill-hint">이미지 파일 1개 · 최대 10MB · 클릭하거나 끌어다 놓으세요</div>
                    </div>
                    <div class="text-warning small mb-3 d-none" id="ocrPartialNotice">일부 항목은 인식하지 못했어요. 확인 후 입력해주세요.</div>

                    <div class="ocr-divider">
                        <span>또는 직접 입력</span>
                    </div>

                    <form id="txnForm">

                        <!-- 유형 토글 -->
                        <div class="mb-3">
                            <label class="form-label">유형</label>
                            <div class="btn-group modal-type-toggle w-100" role="group">
                                <input type="radio" class="btn-check" name="modal-type" id="modal-type-expense" value="EXPENSE" checked>
                                <label class="btn btn-type-expense" for="modal-type-expense">지출</label>

                                <input type="radio" class="btn-check" name="modal-type" id="modal-type-income" value="INCOME">
                                <label class="btn btn-type-income" for="modal-type-income">수입</label>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label d-flex align-items-center gap-1" for="txnDate">
                                    날짜
                                    <span class="ocr-review-badge d-none" id="txnDateBadge">확인 필요</span>
                                </label>
                                <input type="date" class="form-control" id="txnDate">
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label d-flex align-items-center gap-1" for="txnAmount">
                                    금액
                                    <span class="ocr-review-badge d-none" id="txnAmountBadge">확인 필요</span>
                                </label>
                                <div class="amount-input-wrap">
                                    <span class="currency-prefix">₩</span>
                                    <input type="text" class="form-control" id="txnAmount" placeholder="0">
                                </div>
                            </div>
                        </div>

                        <!-- 카테고리 선택: 선택한 유형(지출/수입)에 맞는 카테고리만 렌더링 -->
                        <div class="mb-3">
                            <label class="form-label">카테고리</label>
                            <div class="chip-select d-flex flex-wrap gap-2" id="txnCategoryChips"></div>
                        </div>

                        <!-- 결제수단 선택 -->
                        <div class="mb-3">
                            <label class="form-label">결제수단</label>
                            <div class="chip-select d-flex flex-wrap gap-2" id="txnPaymentChips"></div>
                        </div>

                        <!-- 거래 내용 -->
                        <div class="mb-0">
                            <label class="form-label d-flex align-items-center gap-1" for="txnDescription">
                                거래 내용
                                <span class="ocr-review-badge d-none" id="txnDescriptionBadge">확인 필요</span>
                            </label>
                            <input type="text" class="form-control" id="txnDescription" placeholder="예: 마트 장보기, 6월 급여">
                        </div>

                        <div class="text-danger small mt-2 d-none" id="txnError"></div>

                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-add" id="submitTxnBtn">추가하기</button>
                </div>

            </div>
        </div>
    </div>

</section>
</body>
</html>
