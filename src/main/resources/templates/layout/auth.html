<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title layout:title-pattern="$CONTENT_TITLE - 살림">살림</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>

  <link th:href="@{/css/global.css}" rel="stylesheet"/>
  <link th:href="@{/css/member/auth.css}" rel="stylesheet"/>

  <th:block layout:fragment="styles"></th:block>
</head>
<body class="d-flex flex-column bg-white">
<div class="page page-center" th:classappend="${currentUri == '/signup'} ? 'page-signup'">
  <div class="container container-tight py-4">
    <div class="mb-3">
      <a href="/" class="sallim-back-link d-inline-flex align-items-center gap-1 text-secondary text-decoration-none small">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        홈으로 돌아가기
      </a>
    </div>
    <div layout:fragment="content"></div>
  </div>
</div>

<th:block layout:fragment="scripts"></th:block>
</body>
</html>
