<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <title>대시보드</title>

    <th:block layout:fragment="page-css">
        <style>
            /* .card, .page-pretitle, .page-title 는 global.css 공통 정의 사용 */
            .card-body {
                padding: 1.375rem 1.5rem;
            }

            .date-pill {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                background: #fff;
                border: 1px solid #e6e9ee;
                border-radius: 8px;
                padding: 9px 14px;
                font-size: 0.8125rem;
                font-weight: 600;
                color: var(--sallim-balance);
            }

            /* ===== KPI ===== */
            .kpi-currency {
                font-size: 1.0625rem; /* 17px */
                font-weight: 600;
                color: var(--sallim-balance);
                margin-right: 2px;
            }

            .kpi-number {
                font-size: 1.75rem; /* 28px */
                font-weight: 800;
                letter-spacing: -0.02em;
                color: var(--sallim-balance);
                line-height: 1.1;
            }

            .kpi-sub {
                font-size: 0.75rem;
                color: #8a97a5;
                margin-top: 4px;
            }

            /* 배지: 알약 + 톤다운 배경 (색은 배지에만) */
            .badge-income, .badge-expense, .badge-balance {
                font-size: 0.72rem;
                font-weight: 700;
                padding: 3px 9px;
                border-radius: 20px;
            }

            .badge-income {
                background: rgba(45, 106, 79, 0.10);
                color: var(--sallim-income);
            }

            .badge-expense {
                background: rgba(193, 96, 74, 0.10);
                color: var(--sallim-expense);
            }

            .badge-balance {
                background: rgba(30, 45, 61, 0.08);
                color: var(--sallim-balance);
            }

            /* ===== 차트 타이틀 ===== */
            .chart-title {
                font-size: 0.9375rem; /* 15px */
                font-weight: 700;
                color: var(--sallim-balance);
            }

            /* ===== 거래 목록 ===== */
            .transaction-item {
                display: flex;
                align-items: center;
                gap: 11px;
                padding: 8px 0;
                border-bottom: 1px solid #f0f2f5;
            }

            .transaction-item:last-child {
                border-bottom: none;
            }

            .category-badge {
                width: 32px;
                height: 32px;
                border-radius: 9px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 0.8125rem;
                font-weight: 700;
                flex-shrink: 0;
                background-color: rgba(193, 96, 74, 0.12);
                color: var(--sallim-expense);
            }

            .category-badge.income {
                background-color: rgba(45, 106, 79, 0.10);
                color: var(--sallim-income);
            }

            .transaction-name {
                font-size: 0.8125rem;
                font-weight: 600;
                color: var(--sallim-balance);
            }

            .transaction-meta {
                font-size: 0.71875rem; /* 11.5px */
                color: #8a97a5;
                margin-top: 1px;
            }

            .transaction-amount {
                margin-left: auto;
                font-size: 0.84375rem; /* 13.5px */
                font-weight: 700;
                white-space: nowrap;
                min-width: 120px;
                text-align: right;
            }

            /* ===== 도넛 범례 ===== */
            .donut-legend-item {
                display: grid;
                grid-template-columns: auto 1fr auto auto;
                align-items: center;
                gap: 10px;
                padding: 7px 0;
                font-size: 0.8125rem;
                border-bottom: 1px solid #f0f2f5;
            }

            .donut-legend-item:last-child {
                border-bottom: none;
            }

            .donut-legend-dot {
                width: 10px;
                height: 10px;
                border-radius: 3px; /* 시안: 원이 아니라 둥근 사각형 */
                flex-shrink: 0;
            }

            .donut-legend-name {
                font-weight: 600;
                color: var(--sallim-balance);
            }

            .donut-legend-pct {
                color: #8a97a5;
                font-weight: 600;
                min-width: 42px;
                text-align: right;
            }

            .donut-legend-amount {
                font-weight: 700;
                color: var(--sallim-balance);
                min-width: 86px;
                text-align: right;
            }

            /* 모바일에서는 카드 좌우 패딩을 줄여 차트가 그릴 수 있는 실제 폭을 넓힌다
               (막대 폭은 columnWidth 비율이라, 컨테이너가 넓어질수록 막대도 두꺼워짐) */
            @media (max-width: 767.98px) {
                .card-body {
                    padding: 1.125rem 1rem;
                }
            }
        </style>

        <script src="https://cdn.jsdelivr.net/npm/apexcharts@latest/dist/apexcharts.min.js"></script>
    </th:block>
</head>

<body>
<section layout:fragment="content">
    <div class="page-header d-print-none">
        <div class="container-fluid">
            <div class="row g-2 align-items-center">
                <div class="col">
                    <div class="page-pretitle" style="margin-bottom: 5px;">대시보드</div>
                    <h2 class="page-title">살림 가계부 요약</h2>
                </div>
                <div class="col-auto ms-auto d-print-none">
            <span id="date-pill" class="date-pill" style="cursor:pointer; position:relative;">
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15"
                   viewBox="0 0 24 24" fill="none" stroke="#5b6b7b"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2"/>
                <path d="M16 2v4M8 2v4M3 10h18"/>
              </svg>
              <span id="date-pill-text"></span>
              <input type="month" id="month-picker-input"
                     style="position:absolute; top:0; left:0; opacity:0; border:0; padding:0; pointer-events:none;">
            </span>
                </div>
            </div>
        </div>
    </div>

    <div class="page-body">
        <div class="container-fluid">

            <!-- KPI 카드 -->
            <div class="row row-deck row-cards mb-4">

                <div class="col-sm-6 col-lg-4">
                    <div class="card">
                        <div class="card-body">
                            <div class="d-flex align-items-center justify-content-between mb-3">
                                <span style="font-size:0.8125rem; font-weight:600; color:#5b6b7b;">이번 달 수입</span>
                                <span id="kpi-income-badge" class="badge badge-income"></span>
                            </div>
                            <div>
                                <span class="kpi-currency">₩</span><span id="kpi-income-number" class="kpi-number">-</span>
                            </div>
                            <div id="kpi-income-sub" class="kpi-sub"></div>
                        </div>
                    </div>
                </div>

                <div class="col-sm-6 col-lg-4">
                    <div class="card">
                        <div class="card-body">
                            <div class="d-flex align-items-center justify-content-between mb-3">
                                <span style="font-size:0.8125rem; font-weight:600; color:#5b6b7b;">이번 달 지출</span>
                                <span id="kpi-expense-badge" class="badge badge-expense"></span>
                            </div>
                            <div>
                                <span class="kpi-currency">₩</span><span id="kpi-expense-number" class="kpi-number">-</span>
                            </div>
                            <div id="kpi-expense-sub" class="kpi-sub"></div>
                        </div>
                    </div>
                </div>

                <div class="col-sm-6 col-lg-4">
                    <div class="card">
                        <div class="card-body">
                            <div class="d-flex align-items-center justify-content-between mb-3">
                                <span style="font-size:0.8125rem; font-weight:600; color:#5b6b7b;">현재 잔액</span>
                            </div>
                            <div>
                                <span class="kpi-currency">₩</span><span id="kpi-balance-number" class="kpi-number">-</span>
                            </div>
                            <div class="kpi-sub">보유 계좌 합계</div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- 월별 수입/지출 Bar 차트 -->
            <div class="card mb-4">
                <div class="card-body">
                    <div class="d-flex align-items-center justify-content-between mb-3">
                        <span class="chart-title">월별 수입/지출 현황</span>
                        <div class="d-flex gap-3" style="font-size:0.78125rem; font-weight:600; color:#5b6b7b;">
                <span class="d-flex align-items-center gap-1">
                  <span style="width:11px; height:11px; border-radius:3px; background:var(--sallim-income); display:inline-block;"></span>
                  수입
                </span>
                            <span class="d-flex align-items-center gap-1">
                  <span style="width:11px; height:11px; border-radius:3px; background:var(--sallim-expense); display:inline-block;"></span>
                  지출
                </span>
                        </div>
                    </div>
                    <div id="chart-monthly-bar"></div>
                </div>
            </div>

            <!-- 하단 2열 (도넛 5 : 거래 7 ≒ 40:60) -->
            <div class="row row-deck row-cards">

                <!-- 카테고리별 지출 도넛 차트 -->
                <div class="col-lg-5">
                    <div class="card h-100">
                        <div class="card-body">
                            <div class="chart-title mb-3">카테고리별 지출</div>
                            <div id="chart-category-donut" class="mb-3"></div>
                            <div id="donut-legend"></div>
                        </div>
                    </div>
                </div>

                <!-- 최근 거래 목록 -->
                <div class="col-lg-7">
                    <div class="card h-100">
                        <div class="card-body">
                            <div class="d-flex align-items-center justify-content-between mb-2">
                                <span class="chart-title">최근 거래</span>
                                <a href="/transactions"
                                   style="font-size:0.78125rem; font-weight:600; color:var(--sallim-income); text-decoration:none;">
                                    전체 보기
                                </a>
                            </div>

                            <div id="recent-transaction-list"></div>

                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>
</section>

<th:block layout:fragment="page-js">
    <script th:src="@{/js/dashboard/dashboard.js}"></script>
</th:block>

</body>
</html>
