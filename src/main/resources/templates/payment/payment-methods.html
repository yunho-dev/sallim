<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <title>결제수단 관리</title>

    <th:block layout:fragment="page-css">
        <link th:href="@{/css/payment/payment-methods.css}" rel="stylesheet"/>
    </th:block>

    <th:block layout:fragment="page-js">
        <script th:src="@{/js/payment/payment-methods.js}"></script>
    </th:block>
</head>

<body>
<section layout:fragment="content">

    <!-- 페이지 헤더 -->
    <div class="page-header d-print-none">
        <div class="container-fluid">
            <div class="row g-2 align-items-center">
                <div class="col">
                    <div class="page-pretitle" style="margin-bottom: 5px;">자산</div>
                    <h2 class="page-title">결제수단 관리</h2>
                </div>
                <div class="col-auto ms-auto d-print-none">
                    <button type="button" class="btn btn-add-dark" id="btnOpenModal"
                            data-bs-toggle="modal" data-bs-target="#paymentModal">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                        결제수단 추가
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="page-body">
        <div class="container-fluid">

            <!-- 유형별 결제수단 목록: payment-methods.js에서 GET /api/payment-methods 응답으로 렌더링 -->
            <div id="payment-groups"></div>

            <div class="text-center text-muted py-5 d-none" id="payment-empty">
                등록된 결제수단이 없습니다. 결제수단을 추가해보세요.
            </div>

        </div>
    </div>

    <!-- 결제수단 추가/수정 모달 (하나의 모달을 재사용, editingPaymentMethodId 유무로 모드 구분) -->
    <div class="modal modal-blur fade" id="paymentModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="paymentModalTitle">결제수단 추가</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <form id="paymentForm">

                        <div class="mb-3">
                            <label class="form-label" for="paymentName">결제수단 이름</label>
                            <input type="text" class="form-control" id="paymentName" placeholder="예: 신한카드, 카카오페이">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">유형</label>
                            <div class="type-select" id="typeSelect">
                                <input type="radio" class="btn-check" name="payment-type" id="type-card" value="CARD" checked>
                                <label class="btn" for="type-card">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
                                         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="2" y="5" width="20" height="14" rx="2"/>
                                        <path d="M2 10h20"/>
                                    </svg>
                                    카드
                                </label>

                                <input type="radio" class="btn-check" name="payment-type" id="type-bank" value="ACCOUNT_TRANSFER">
                                <label class="btn" for="type-bank">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
                                         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M3 21h18M3 10h18M5 6l7-3 7 3M4 10v11M20 10v11M8 14v3M12 14v3M16 14v3"/>
                                    </svg>
                                    계좌이체
                                </label>

                                <input type="radio" class="btn-check" name="payment-type" id="type-cash" value="CASH">
                                <label class="btn" for="type-cash">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
                                         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="2" y="6" width="20" height="12" rx="2"/>
                                        <circle cx="12" cy="12" r="2.5"/>
                                        <path d="M6 12h.01M18 12h.01"/>
                                    </svg>
                                    현금
                                </label>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="paymentAccount">연결 계좌</label>
                            <select class="form-select" id="paymentAccount">
                                <option value="">연결 안 함</option>
                            </select>
                        </div>

                        <div class="mb-0">
                            <label class="form-label" for="paymentMemo">메모</label>
                            <textarea class="form-control" id="paymentMemo" rows="3" placeholder="예: 교통비 전용, 정기결제용"></textarea>
                        </div>

                        <div class="text-danger small mt-2 d-none" id="paymentError"></div>

                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-add-dark" id="submitPaymentBtn">추가하기</button>
                </div>

            </div>
        </div>
    </div>

</section>
</body>
</html>
