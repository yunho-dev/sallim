<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <title>계좌 관리</title>

    <th:block layout:fragment="page-css">
        <link th:href="@{/css/account/accounts.css}" rel="stylesheet"/>
    </th:block>

    <th:block layout:fragment="page-js">
        <script th:src="@{/js/account/accounts.js}"></script>
    </th:block>
</head>

<body>
<section layout:fragment="content">

    <!-- 페이지 헤더 -->
    <div class="page-header d-print-none">
        <div class="container-fluid">
            <div class="row g-2 align-items-center">
                <div class="col">
                    <div class="page-pretitle" style="margin-bottom: 5px;">자산</div>
                    <h2 class="page-title">계좌 관리</h2>
                </div>
                <div class="col-auto ms-auto d-print-none">
                    <button type="button" class="btn btn-add-dark" data-bs-toggle="modal" data-bs-target="#modal-add-account">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                        계좌 추가
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="page-body">
        <div class="container-fluid">

            <!-- 전체 자산 요약 -->
            <div class="asset-summary">
                <div>
                    <div class="asset-summary-label">전체 자산 합계</div>
                    <div class="d-flex align-items-baseline gap-1">
                        <span class="asset-summary-currency">₩</span>
                        <span class="asset-summary-value" id="summary-total">0</span>
                    </div>
                    <div class="asset-summary-sub" id="summary-sub">등록 계좌 0개 · 0개 은행</div>
                </div>
                <div class="asset-summary-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"
                         fill="none" stroke="#2D6A4F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 21h18M3 10h18M5 6l7-3 7 3M4 10v11M20 10v11M8 14v3M12 14v3M16 14v3"/>
                    </svg>
                </div>
            </div>

            <!-- 은행별 계좌 목록: accounts.js에서 GET /api/accounts 응답으로 렌더링 -->
            <div id="account-groups"></div>

            <div class="text-center text-muted py-5 d-none" id="account-empty">
                등록된 계좌가 없습니다. 계좌를 추가해보세요.
            </div>

        </div>
    </div>

    <!-- 계좌 추가 모달 -->
    <div class="modal modal-blur fade" id="modal-add-account" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">계좌 추가</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <form id="addAccountForm">

                        <!-- 은행 선택: accounts.js에서 GET /api/accounts/banks 응답으로 렌더링 -->
                        <div class="mb-3">
                            <label class="form-label">은행 선택</label>
                            <div class="bank-select" id="bankSelect"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="accountNo">계좌번호</label>
                            <input type="text" class="form-control" id="accountNo" placeholder="예: 110-123-456789">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="accountName">계좌 별명</label>
                            <input type="text" class="form-control" id="accountName" placeholder="예: 생활비 통장, 비상금">
                        </div>

                        <div class="mb-0">
                            <label class="form-label" for="accountBalance">초기 잔액</label>
                            <div class="amount-input-wrap">
                                <span class="currency-prefix">₩</span>
                                <input type="text" class="form-control" id="accountBalance" placeholder="0">
                                <span class="unit-suffix">원</span>
                            </div>
                        </div>

                        <div class="text-danger small mt-2 d-none" id="addAccountError"></div>

                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-add-dark" id="submitAccountBtn">계좌 추가</button>
                </div>

            </div>
        </div>
    </div>

    <!-- 계좌 별명 수정 모달 -->
    <div class="modal modal-blur fade" id="modal-edit-account" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">계좌 별명 수정</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <form id="editAccountForm">
                        <div class="mb-0">
                            <label class="form-label" for="editAccountName">계좌 별명</label>
                            <input type="text" class="form-control" id="editAccountName">
                        </div>
                        <div class="text-danger small mt-2 d-none" id="editAccountError"></div>
                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-add-dark" id="submitEditAccountBtn">저장</button>
                </div>

            </div>
        </div>
    </div>

</section>
</body>
</html>
